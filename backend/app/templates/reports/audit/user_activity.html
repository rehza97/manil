{% extends "reports/base_report.html" %}
{% block summary %}
  <div class="executive-summary">
    <div class="kpi-card">
      <div class="kpi-value">{{ details | length if details is defined else 0 }}</div>
      <div class="kpi-label">Active Users (Top)</div>
    </div>
  </div>
{% endblock %}
{% block data %}
  <div class="data-section">
    <table class="data-table">
      <thead>
        <tr><th>User ID</th><th>Action Count</th></tr>
      </thead>
      <tbody>
        {% for row in details or [] %}
        <tr><td>{{ row.user_id }}</td><td>{{ row.action_count }}</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
